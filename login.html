<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ananta — Next Level Education</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Symbols Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Auth specific overrides */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-main);
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }
        
        /* Background Glows */
        .auth-glow-cyan {
            position: absolute; width: 60vh; height: 60vh;
            background: radial-gradient(circle at center, rgba(0,229,255,0.15) 0%, transparent 60%);
            top: -10%; left: -10%; filter: blur(60px); z-index: 0;
            animation: pulse-glow 8s infinite alternate;
        }
        .auth-glow-purple {
            position: absolute; width: 70vh; height: 70vh;
            background: radial-gradient(circle at center, rgba(206,130,255,0.1) 0%, transparent 60%);
            bottom: -20%; right: -10%; filter: blur(60px); z-index: 0;
            animation: pulse-glow 10s infinite alternate-reverse;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            z-index: 10;
            padding: 20px;
            perspective: 1000px;
        }

        /* Glassmorphic ID Card style from the main app */
        .auth-card {
            background: var(--glass-bg); /* Surface Glass */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s;
        }
        
        .auth-card::before {
            content:''; position: absolute; top:0; left:0; right:0; height:4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-header .logo-icon {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 8px;
            display: inline-block;
            animation: float 3s ease-in-out infinite alternate;
        }
        .auth-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
            margin-top: 0;
        }
        .auth-header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }
        .input-group .material-symbols-rounded {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 20px;
            pointer-events: none;
            transition: color 0.3s;
        }
        .input-group input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 14px 14px 44px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: var(--primary-color);
            background: rgba(0,229,255,0.05);
        }
        .input-group input:focus + .material-symbols-rounded {
            color: var(--primary-color);
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
            gap: 10px;
        }
        .google-btn img {
            width: 20px;
            height: 20px;
        }
        .google-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        .auth-switch {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .auth-switch a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }
        .auth-switch a:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--primary-color);
        }

        #signup-view { display: none; }
        
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            font-family: 'Inter', sans-serif;
        }
        .alert.error { background: rgba(255,75,75,0.15); border: 1px solid rgba(255,75,75,0.3); color: #ff7575; }
        .alert.success { background: rgba(0,200,83,0.15); border: 1px solid rgba(0,200,83,0.3); color: #00e676; }
        
        button.primary-button {
            width: 100%; 
            margin-top: 16px;
            padding: 14px;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }

        button.primary-button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.5);
        }

        button.primary-button:active {
            transform: translateY(0);
        }

        button.primary-button:disabled {
            background: #4a5568 !important;
            color: #a0aec0 !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 24px;
            }
            .auth-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-glow-cyan"></div>
    <div class="auth-glow-purple"></div>

    <div class="auth-container">
        <!-- SIGN IN VIEW -->
        <div class="auth-card" id="signin-view">
            <div class="auth-header">
                <span class="material-symbols-rounded logo-icon">all_inclusive</span>
                <h2>Welcome Back</h2>
                <p>Sign in to continue your learning journey</p>
            </div>

            <div class="alert error" id="signin-error"></div>
            <div class="alert success" id="signin-success"></div>

            <form id="signin-form">
                <div class="input-group">
                    <input type="text" id="si-username" placeholder="Username or Email" required autocomplete="username">
                    <span class="material-symbols-rounded">person</span>
                </div>
                <div class="input-group">
                    <input type="password" id="si-password" placeholder="Password" required autocomplete="current-password">
                    <span class="material-symbols-rounded">lock</span>
                </div>
                <button type="submit" class="primary-button" id="btn-signin">
                    Sign in with Ananta
                </button>
            </form>

            <div class="auth-switch">
                Don't have an account? <a onclick="toggleView('signup')">Sign Up</a>
            </div>
        </div>

        <!-- SIGN UP VIEW -->
        <div class="auth-card" id="signup-view">
            <div class="auth-header">
                <span class="material-symbols-rounded logo-icon">all_inclusive</span>
                <h2>Join Ananta</h2>
                <p>Next Level Education for many generations</p>
            </div>

            <div class="alert error" id="signup-error"></div>
            <div class="alert success" id="signup-success"></div>

            <button class="google-btn" onclick="alert('Google Sign Up coming soon!')">
                <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Sign up with Google
            </button>

            <div class="divider">or Sign up with Email</div>

            <form id="signup-form">
                <div class="input-group">
                    <input type="text" id="su-username" placeholder="Username" required autocomplete="username">
                    <span class="material-symbols-rounded">person</span>
                </div>
                <div class="input-group">
                    <input type="email" id="su-email" placeholder="Email Address" required autocomplete="email">
                    <span class="material-symbols-rounded">mail</span>
                </div>
                <div class="input-group">
                    <input type="password" id="su-password" placeholder="Password" required autocomplete="new-password">
                    <span class="material-symbols-rounded">lock</span>
                </div>
                <button type="submit" class="primary-button" id="btn-signup">
                    Sign Up
                </button>
            </form>

            <div class="auth-switch">
                Already have an account? <a onclick="toggleView('signin')">Sign up with Ananta</a>
            </div>
            <!-- ^ Wait, shouldn't it be "Sign in"? Will fix in a moment via script but this is fine. Actually fixed below. -->
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        document.querySelector('.auth-switch a[onclick="toggleView(\\\'signin\\\')"]').textContent = 'Sign In';

        // PENTING: Menggunakan URL global dari config.js
        const DB_API_URL = CONFIG.DB_API_URL || CONFIG.API_URL;
        const API_URL = DB_API_URL;
        const API_BASE = DB_API_URL + '/api';

        function toggleView(view) {
            const si = document.getElementById('signin-view');
            const su = document.getElementById('signup-view');
            si.style.display = view === 'signin' ? 'block' : 'none';
            su.style.display = view === 'signup' ? 'block' : 'none';
        }

        function showAlert(type, action, message) {
            const el = document.getElementById(`${action}-${type}`);
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-signup');
            btn.innerHTML = 'Signing Up...';
            btn.disabled = true;

            const username = document.getElementById('su-username').value;
            const email = document.getElementById('su-email').value;
            const password = document.getElementById('su-password').value;

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showAlert('success', 'signup', 'Registration successful! You can now sign in.');
                    setTimeout(() => toggleView('signin'), 1500);
                } else {
                    showAlert('error', 'signup', data.error || 'Registration failed');
                }
            } catch (err) {
                showAlert('error', 'signup', 'Failed to connect to the server.');
            } finally {
                btn.innerHTML = 'Sign Up';
                btn.disabled = false;
            }
        });

        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-signin');
            btn.innerHTML = 'Signing In...';
            btn.disabled = true;

            const username = document.getElementById('si-username').value;
            const password = document.getElementById('si-password').value;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showAlert('success', 'signin', 'Login successful! Redirecting...');
                    localStorage.setItem('ananta_token', data.token);
                    localStorage.setItem('ananta_username', data.user.username);
                    if (data.user.profile_picture) {
                        localStorage.setItem('ananta_avatar', DB_API_URL + data.user.profile_picture);
                    } else {
                        localStorage.removeItem('ananta_avatar');
                    }
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showAlert('error', 'signin', data.error || 'Invalid credentials');
                }
            } catch (err) {
                showAlert('error', 'signin', 'Failed to connect to the server.');
            } finally {
                btn.innerHTML = 'Sign in with Ananta';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
